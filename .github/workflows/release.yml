# Builds the binaries and the Linux packages of a release, and publishes
# them only from a tag.
#
# A run started by hand builds every host, makes every package and computes
# every checksum, and it publishes nothing. That is the way to test this file
# without a release.
#
# The job that publishes is the only job that holds a write token, and it runs
# only for a tag. The attestation is made there too. On a public repository an
# attestation goes into the public Sigstore log, so a test run makes none.
#
# Every action is pinned to the commit of a release, for the reason that
# ci.yml gives.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      # A release that lacks one host is not a release. Stop at the first
      # failure rather than publish five binaries out of six.
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      # --locked builds the dependency versions that Cargo.lock names and
      # refuses to change them. A release is the build that matters most, so
      # it gets no freedom that the gate did not have.
      #
      # Linux builds against musl, so the binary carries its C library and
      # runs on any distribution. The MSVC builds link the C runtime in, which
      # .cargo/config.toml arranges. No dependency of att compiles C, so no
      # target needs a C compiler of its own.
      - name: build
        run: cargo build --release --locked -p allthetools --target ${{ matrix.target }}

      - name: collect
        shell: bash
        run: |
          mkdir out
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/att${suffix}" "out/att${suffix}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: att-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  packages:
    name: name the files, make the Linux packages and hash them
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Each tool version is exact, as each dependency of att is.
      - name: install the package tools
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: att-*
          path: built/

      # One machine names and hashes every file, so every checksum comes from
      # the same tool. The packages take the musl binaries that the build
      # made, and they build nothing again.
      - name: name, package and hash
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "allthetools") | .version')
          mkdir dist
          for dir in built/att-*; do
            target=${dir#built/att-}
            for file in "$dir"/*; do
              suffix=""
              case "$file" in *.exe) suffix=".exe" ;; esac
              cp "$file" "dist/att-${version}-${target}${suffix}"
            done
          done
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            mkdir -p "target/${target}/release"
            cp "built/att-${target}/att" "target/${target}/release/att"
            chmod 0755 "target/${target}/release/att"
            cargo deb -p allthetools --no-build --no-strip --target "$target" --output dist/
            cargo generate-rpm -p crates/allthetools --target "$target" --output dist/
          done
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          echo "${version}" > ../VERSION

      # A package that its own tool refuses is no package. dpkg installs the
      # Debian package on this runner, and rpm reads the RPM package.
      - name: install the packages
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i dist/allthetools_*_amd64.deb
          att --version
          sudo dpkg -r allthetools
          sudo apt-get install -y rpm > /dev/null
          rpm -qip dist/allthetools-*.x86_64.rpm
          rpm -qlp dist/allthetools-*.x86_64.rpm | grep -qx /usr/bin/att

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            VERSION
          if-no-files-found: error

  release:
    name: publish a draft release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      # A tag that disagrees with the version in Cargo.toml gives a binary
      # whose --version names a release it does not belong to.
      - name: check that the tag names the version
        shell: bash
        run: |
          version=$(cat VERSION)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME} and Cargo.toml says ${version}." >&2
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/att-*
            dist/*.deb
            dist/*.rpm

      # A draft, so that a person reads the assets before anybody else can
      # download them. Three tools of att write to drives.
      - name: open the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "AllTheTools ${GITHUB_REF_NAME}" \
            --generate-notes
