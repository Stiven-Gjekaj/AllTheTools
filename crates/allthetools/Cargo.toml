[package]
name = "allthetools"
description = "The same small tools on Windows, on macOS and on Linux, in one binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["cli", "cross-platform", "lsusb", "lsblk", "f3probe"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "att"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
goblin.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true

# The bindings of one host never reach the other two. Each tool keeps its
# decisions in a pure module that every host compiles.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
]

[lints]
workspace = true

# The Debian package. The release workflow builds it from the musl binary,
# with `cargo deb --no-build`, so the package needs no library of the host.
[package.metadata.deb]
name = "allthetools"
maintainer = "Stiven Gjekaj <stivenagostingjekaj@gmail.com>"
copyright = "2026, Stiven Gjekaj"
license-file = ["../../LICENSE", "0"]
extended-description = """\
One command, att, that gives the same small tools on Windows, on macOS and on \
Linux: lsusb, lspci, lsblk, f3probe, badblocks, sensors, ldd, timeout, \
caffeinate, a clipboard, Wake-on-LAN, networkQuality and more."""
section = "utils"
priority = "optional"
depends = ""
assets = [
    ["target/release/att", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/allthetools/README.md", "644"],
]

# The RPM package, from the same musl binary, with
# `cargo generate-rpm --target`.
[package.metadata.generate-rpm]
name = "allthetools"
summary = "The same small tools on Windows, on macOS and on Linux, in one binary"
auto-req = "no"
assets = [
    { source = "target/release/att", dest = "/usr/bin/att", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/allthetools/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/allthetools/README.md", mode = "644", doc = true },
]
