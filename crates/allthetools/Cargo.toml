[package]
name = "allthetools"
description = "The same small tools on Windows, on macOS and on Linux, in one binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["cli", "cross-platform", "lsusb", "lsblk", "f3probe"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "att"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
goblin.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true

# The bindings of one host never reach the other two. Each tool keeps its
# decisions in a pure module that every host compiles.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Threading",
]

[lints]
workspace = true
